<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Web is Magic</title>
    <style>
        :root {
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Keeps confetti from creating scrollbars */
            position: relative;
        }

        /* The interactive glowing background */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(
                circle 600px at var(--mouse-x) var(--mouse-y), 
                rgba(56, 189, 248, 0.15),
                transparent 80%
            );
            z-index: 0;
            pointer-events: none; /* Lets you click through the glow */
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        button {
            background: linear-gradient(45deg, #a855f7, #ec4899);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            outline: none;
        }

        button:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 10px 20px rgba(236, 72, 153, 0.4);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Tiny colored squares for the JS confetti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Vanilla Web is Magic</h1>
        <p>Move your mouse around, and try clicking the button.</p>
        <button id="partyBtn">Pop Confetti!</button>
    </div>

    <script>
        // 1. Interactive Mouse Glow
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            // Update CSS variables in real-time
            document.documentElement.style.setProperty('--mouse-x', `${x}px`);
            document.documentElement.style.setProperty('--mouse-y', `${y}px`);
        });

        // 2. Confetti Explosion Logic
        const button = document.getElementById('partyBtn');
        const colors = ['#38bdf8', '#a855f7', '#ec4899', '#fbbf24', '#34d399'];

        button.addEventListener('click', (e) => {
            // Get button position to center the explosion
            const rect = button.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < 50; i++) {
                createConfetti(centerX, centerY);
            }
        });

        function createConfetti(x, y) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            
            // Randomize colors, starting position offset, and velocities
            const color = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.backgroundColor = color;
            confetti.style.left = `${x}px`;
            confetti.style.top = `${y}px`;

            document.body.appendChild(confetti);

            // Physics variables
            const angle = Math.random() * Math.PI * 2;
            const velocity = 5 + Math.random() * 15;
            let vx = Math.cos(angle) * velocity;
            let vy = Math.sin(angle) * velocity;
            let gravity = 0.5;
            let opacity = 1;
            let rotation = Math.random() * 360;
            let rotationSpeed = (Math.random() - 0.5) * 20;

            // Animation loop
            function animate() {
                vy += gravity; // Pull downwards over time
                x += vx;
                y += vy;
                opacity -= 0.02; // Fade out
                rotation += rotationSpeed; // Spin

                confetti.style.transform = `translate(${x - window.innerWidth/2}px, ${y - window.innerHeight/2}px) rotate(${rotation}deg)`;
                confetti.style.opacity = opacity;

                if (opacity > 0) {
                    requestAnimationFrame(animate);
                } else {
                    confetti.remove(); // Clean up DOM when invisible
                }
            }

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
